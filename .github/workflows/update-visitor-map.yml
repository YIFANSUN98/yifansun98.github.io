name: Update visitor globe data

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_visitor_map.py"
      - ".github/workflows/update-visitor-map.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-globe-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Refresh visitor-country totals
        run: python3 scripts/update_visitor_map.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/visitor-map.json; then
            echo "Visitor data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-map.json
          git commit -m "update visitor globe data"
          git push
